openapi: 3.0.3
info:
  title: Klubok API
  version: 0.1.0
  description: |
    API сервиса планирования путешествий Klubok.
    Обзор и правила — docs/08-api.md. Этот файл — источник истины для контракта.
servers:
  - url: /api/v1

tags:
  - name: places
    description: Справочник городов и транспортных узлов
  - name: search
    description: Подбор вариантов поездки

paths:
  /places:
    get:
      tags: [places]
      operationId: searchPlaces
      summary: Автодополнение точек по названию или IATA-коду
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
          description: Начало названия (ru/en) или IATA-код
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PlaceKind' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Найденные точки, лучшие совпадения первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Place' }
        '422': { $ref: '#/components/responses/Problem' }

  /places/{id}:
    get:
      tags: [places]
      operationId: getPlace
      summary: Точка по идентификатору
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Точка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '404': { $ref: '#/components/responses/Problem' }

  /car-hubs:
    get:
      tags: [search]
      operationId: listCarHubs
      summary: Аэропорты, до которых можно доехать на машине, и расходы на дорогу
      description: |
        Для каждого аэропорта в радиусе — расстояние и время по дороге, расходы на машину туда и обратно
        (топливо, парковка на время поездки, страховка при въезде в другую страну). Сортировка — по времени в пути с учётом границы.
        Аэропорты, до которых ехать дольше max_drive_hours (с учётом времени на границе), не возвращаются.
      parameters:
        - name: from
          in: query
          required: true
          description: Домашний город
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/MaxDriveHours'
        - name: days
          in: query
          description: Длительность поездки в сутках — для парковки
          schema: { type: integer, minimum: 1, maximum: 60, default: 7 }
        - $ref: '#/components/parameters/Travelers'
        - $ref: '#/components/parameters/ConsumptionL100'
        - $ref: '#/components/parameters/FuelTypeParam'
        - $ref: '#/components/parameters/FuelPriceRub'
        - $ref: '#/components/parameters/AllowBorder'
      responses:
        '200':
          description: Хабы с расходами на машину
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarHubsResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /trips:
    get:
      tags: [search]
      operationId: searchTrips
      summary: Самые дешёвые поездки туда и обратно с учётом дороги до соседних аэропортов
      description: |
        Для каждого доступного аэропорта вылета — лучший по полной стоимости вариант: билеты на всех
        + машина (бензин, парковка на фактические дни поездки, страховка). Сортировка — по полной стоимости.
        Цены — из кэша поисков Aviasales, поэтому ищем по месяцу и длительности, а не по точным датам.
      parameters:
        - name: from
          in: query
          required: true
          description: Домашний город
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          description: Город или аэропорт назначения
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: true
          description: Месяц вылета
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-11' }
        - name: min_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 3 }
        - name: max_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 14 }
        - $ref: '#/components/parameters/Travelers'
        - name: use_car
          in: query
          description: Есть машина — искать и в соседних аэропортах
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/MaxDriveHours'
        - $ref: '#/components/parameters/ConsumptionL100'
        - $ref: '#/components/parameters/FuelTypeParam'
        - $ref: '#/components/parameters/FuelPriceRub'
        - $ref: '#/components/parameters/AllowBorder'
      responses:
        '200':
          description: Варианты поездки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripsResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    RadiusKm:
      name: radius_km
      in: query
      schema: { type: integer, minimum: 0, maximum: 1000, default: 100 }
    MaxDriveHours:
      name: max_drive_hours
      in: query
      description: Максимум часов за рулём в одну сторону; 0 — без ограничения
      schema: { type: number, format: double, minimum: 0, maximum: 24, default: 8 }
    Travelers:
      name: travelers
      in: query
      schema: { type: integer, minimum: 1, maximum: 9, default: 1 }
    ConsumptionL100:
      name: consumption_l100
      in: query
      description: Расход топлива, л/100 км
      schema: { type: number, format: double, minimum: 2, maximum: 30, default: 8 }
    FuelTypeParam:
      name: fuel_type
      in: query
      schema: { $ref: '#/components/schemas/FuelType' }
    FuelPriceRub:
      name: fuel_price_rub
      in: query
      description: Своя цена топлива за литр; если не задана — из справочника
      schema: { type: number, format: double, minimum: 1, maximum: 1000 }
    AllowBorder:
      name: allow_border
      in: query
      description: Учитывать аэропорты в другой стране
      schema: { type: boolean, default: false }
    PlaceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    PlaceKind:
      type: string
      enum: [city, airport]

    Place:
      type: object
      required: [id, kind, iata, name, country_code, location, timezone]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PlaceKind' }
        iata: { type: string, example: KUF }
        city_iata:
          type: string
          description: Код города, к которому относится аэропорт
          example: KUF
        city_name:
          type: string
          description: Название города, к которому относится аэропорт
          example: Самара
        name: { type: string, example: Самара }
        name_en: { type: string, example: Samara }
        name_to:
          type: string
          description: Название в винительном падеже с предлогом
          example: в Самару
        country_code: { type: string, example: RU }
        location: { $ref: '#/components/schemas/Point' }
        timezone: { type: string, example: Europe/Samara }

    Money:
      type: object
      description: Сумма в минимальных единицах валюты (копейках)
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, example: 327360 }
        currency: { type: string, enum: [RUB] }

    FuelType:
      type: string
      enum: [ai92, ai95, dt, lpg]
      default: ai95

    CarHubsResponse:
      type: object
      required: [home, fuel_price, fuel_price_source, items]
      properties:
        home: { $ref: '#/components/schemas/Place' }
        fuel_price: { $ref: '#/components/schemas/Money' }
        fuel_price_source:
          type: string
          enum: [reference, user]
          description: reference — цена из справочника, user — задана пользователем
        items:
          type: array
          items: { $ref: '#/components/schemas/CarHub' }

    CarHub:
      type: object
      required: [place, straight_km, road, drive_hours, cost, per_person, parking_estimated]
      properties:
        place: { $ref: '#/components/schemas/Place' }
        straight_km: { type: number, format: double }
        road: { $ref: '#/components/schemas/RoadLeg' }
        drive_hours:
          type: number
          format: double
          description: Время в пути в одну сторону, включая время на границе
        cost: { $ref: '#/components/schemas/CarCost' }
        per_person: { $ref: '#/components/schemas/Money' }
        parking_estimated:
          type: boolean
          description: Цена парковки неизвестна, взято значение по умолчанию
        border: { $ref: '#/components/schemas/BorderInfo' }

    RoadLeg:
      type: object
      required: [distance_km, duration_min, approximate]
      properties:
        distance_km: { type: number, format: double }
        duration_min: { type: integer }
        approximate:
          type: boolean
          description: Оценка по прямой — маршрутизатор был недоступен

    CarCost:
      type: object
      description: Расходы на машину туда и обратно на всю группу
      required: [fuel, parking, border, total]
      properties:
        fuel: { $ref: '#/components/schemas/Money' }
        parking: { $ref: '#/components/schemas/Money' }
        border: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }

    BorderInfo:
      type: object
      required: [insurance, crossing_hours, note]
      properties:
        insurance: { $ref: '#/components/schemas/Money' }
        crossing_hours: { type: number, format: double }
        note: { type: string }

    TripsResponse:
      type: object
      required: [home, destination, options, no_data, partial]
      properties:
        home: { $ref: '#/components/schemas/Place' }
        destination: { $ref: '#/components/schemas/Place' }
        fuel_price: { $ref: '#/components/schemas/Money' }
        options:
          type: array
          description: Лучший вариант через каждый аэропорт, дешёвые первыми
          items: { $ref: '#/components/schemas/TripOption' }
        home_best:
          $ref: '#/components/schemas/TripOption'
        no_data:
          type: array
          description: Аэропорты, по которым у источника нет цен на этот месяц
          items: { $ref: '#/components/schemas/Place' }
        partial:
          type: boolean
          description: Часть запросов к источнику цен не удалась

    TripOption:
      type: object
      required: [hub, depart_at, return_at, trip_days, airline, transfers, return_transfers,
                 duration_to_min, duration_back_min, ticket_per_person, tickets, total, per_person, warnings]
      properties:
        hub: { $ref: '#/components/schemas/Place' }
        depart_at: { type: string, format: date-time }
        return_at: { type: string, format: date-time }
        trip_days: { type: integer }
        airline: { type: string, example: FS }
        transfers: { type: integer }
        return_transfers: { type: integer }
        duration_to_min: { type: integer }
        duration_back_min: { type: integer }
        found_on:
          type: string
          format: date
          description: Когда источник видел эту цену
        booking_url: { type: string }
        ticket_per_person:
          $ref: '#/components/schemas/Money'
        tickets:
          $ref: '#/components/schemas/Money'
        car: { $ref: '#/components/schemas/TripCar' }
        total: { $ref: '#/components/schemas/Money' }
        per_person: { $ref: '#/components/schemas/Money' }
        savings_vs_home:
          $ref: '#/components/schemas/Money'
        warnings:
          type: array
          items:
            type: string
            enum: [border_crossing_by_car, stale_price, parking_estimated, road_approximate]

    TripCar:
      type: object
      required: [road, drive_hours, cost]
      properties:
        road: { $ref: '#/components/schemas/RoadLeg' }
        drive_hours: { type: number, format: double }
        cost: { $ref: '#/components/schemas/CarCost' }
        border: { $ref: '#/components/schemas/BorderInfo' }

    Point:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double }
        lon: { type: number, format: double }

    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
