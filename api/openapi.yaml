openapi: 3.0.3
info:
  title: Klubok API
  version: 0.1.0
  description: |
    API сервиса планирования путешествий Klubok.
    Обзор и правила — docs/08-api.md. Этот файл — источник истины для контракта.
servers:
  - url: /api/v1

tags:
  - name: places
    description: Справочник городов и транспортных узлов
  - name: search
    description: Подбор вариантов поездки
  - name: map
    description: Места на карте из OpenStreetMap
  - name: transfers
    description: Как добраться внутри города — из аэропорта или с вокзала до жилья
  - name: favorites
    description: Избранные маршруты; до авторизации — по анонимной сессии

paths:
  /places:
    get:
      tags: [places]
      operationId: searchPlaces
      summary: Автодополнение точек по названию или IATA-коду
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
          description: Начало названия (ru/en) или IATA-код
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PlaceKind' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Найденные точки, лучшие совпадения первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Place' }
        '422': { $ref: '#/components/responses/Problem' }

  /places/{id}:
    get:
      tags: [places]
      operationId: getPlace
      summary: Точка по идентификатору
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Точка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '404': { $ref: '#/components/responses/Problem' }

  /places/{id}/pois:
    get:
      tags: [map]
      operationId: listPlacePois
      summary: Достопримечательности вокруг точки
      description: В радиусе 15 км. Первый запрос по точке может идти несколько секунд — данные загружаются из OpenStreetMap.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Места
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoiList' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /places/{id}/guide:
    get:
      tags: [map]
      operationId: getPlaceGuide
      summary: Путеводитель по городу — обзор и места, отобранные авторами Викигида
      description: |
        Для аэропорта — его город. Статья загружается при первом запросе и проверяется раз в 30 дней
        (ревизия не менялась — не разбирается заново). Источник и лицензию нужно показывать рядом с данными.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Путеводитель
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guide' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /pois/{type}/{id}:
    get:
      tags: [map]
      operationId: getPoi
      summary: Место с подробностями — описание и фото
      description: |
        Описание и фото берутся из Wikidata, Википедии и Wikimedia Commons при первом запросе и сохраняются.
        Если Википедия не ответила — место возвращается без них (details_pending остаётся true).
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [node, way, relation] }
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Место
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poi' }
        '404': { $ref: '#/components/responses/Problem' }

  /hotels/link:
    get:
      tags: [search]
      operationId: getHotelsLink
      summary: Ссылка на поиск жилья — отели Островка, жильё на Суточно.ру или квартиры посуточно на Авито
      description: |
        Для аэропорта берётся его город. Если в Travelpayouts подключена программа Островка (TRAVELPAYOUTS_TRS),
        ссылка партнёрская. Город не нашёлся на Островке — ссылка на страницу страны.
        Суточно.ру — поиск с городом, датами и гостями (Россия и ещё 11 стран, иначе 404); партнёрская, как Островок,
        если программа Суточно.ру подключена в том же проекте Travelpayouts.
        Авито — раздел «Квартиры посуточно» в городе; для городов не в России — 404.
      parameters:
        - name: place
          in: query
          description: Город или аэропорт справочника; нужен place или city
          schema: { type: string, format: uuid }
        - name: city
          in: query
          description: Город карты (id Wikidata) — для остановок по пути (ADR-0023); только sutochno и avito
          schema: { type: string, pattern: '^Q\d+$', example: Q900 }
        - name: check_in
          in: query
          required: true
          schema: { type: string, format: date }
        - name: check_out
          in: query
          required: true
          schema: { type: string, format: date }
        - name: provider
          in: query
          description: 'Где искать: ostrovok — отели, sutochno — квартиры, дома и гостевые дома (Россия и СНГ, с датами), avito — квартиры посуточно (только Россия, без дат — их выбирают на Авито)'
          schema: { $ref: '#/components/schemas/HotelsProvider' }
        - $ref: '#/components/parameters/Travelers'
      responses:
        '200':
          description: Ссылка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelsLink' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /hotels/go:
    get:
      tags: [search]
      operationId: goToHotels
      summary: Переход на поиск жилья — то же, что /hotels/link, но перенаправлением
      description: 'Для кнопки «Найти отель» — ссылку не нужно получать заранее, а Островок проверяет адрес города медленно.'
      parameters:
        - name: place
          in: query
          description: Город или аэропорт справочника; нужен place или city
          schema: { type: string, format: uuid }
        - name: city
          in: query
          description: Город карты (id Wikidata) — для остановок по пути (ADR-0023); только sutochno и avito
          schema: { type: string, pattern: '^Q\d+$', example: Q900 }
        - name: check_in
          in: query
          required: true
          schema: { type: string, format: date }
        - name: check_out
          in: query
          required: true
          schema: { type: string, format: date }
        - name: provider
          in: query
          description: 'Где искать: ostrovok — отели, sutochno — квартиры, дома и гостевые дома (Россия и СНГ, с датами), avito — квартиры посуточно (только Россия, без дат — их выбирают на Авито)'
          schema: { $ref: '#/components/schemas/HotelsProvider' }
        - $ref: '#/components/parameters/Travelers'
      responses:
        '302':
          description: Перенаправление на Островок, Суточно.ру или Авито
          headers:
            Location:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /car-hubs:
    get:
      tags: [search]
      operationId: listCarHubs
      summary: Аэропорты, до которых можно доехать на машине, и расходы на дорогу
      description: |
        Для каждого аэропорта в радиусе — расстояние и время по дороге, расходы на машину туда и обратно
        (топливо, парковка на время поездки, страховка при въезде в другую страну). Сортировка — по времени в пути с учётом границы.
        Аэропорты, до которых ехать дольше max_drive_hours (с учётом времени на границе), не возвращаются.
      parameters:
        - name: from
          in: query
          required: true
          description: Домашний город
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/MaxDriveHours'
        - name: days
          in: query
          description: Длительность поездки в сутках — для парковки
          schema: { type: integer, minimum: 1, maximum: 60, default: 7 }
        - $ref: '#/components/parameters/Travelers'
        - $ref: '#/components/parameters/ConsumptionL100'
        - $ref: '#/components/parameters/FuelTypeParam'
        - $ref: '#/components/parameters/FuelPriceRub'
        - $ref: '#/components/parameters/AllowBorder'
      responses:
        '200':
          description: Хабы с расходами на машину
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarHubsResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /trips:
    get:
      tags: [search]
      operationId: searchTrips
      summary: Самые дешёвые поездки туда и обратно с учётом дороги до соседних аэропортов
      description: |
        Для каждого доступного аэропорта вылета — лучший по полной стоимости вариант: билеты на всех
        + машина (бензин, парковка на фактические дни поездки, страховка). Сортировка — по полной стоимости.
        Цены — из кэша поисков Aviasales: по месяцам, покрывающим диапазон дат, с фильтром по датам и
        длительности на нашей стороне. Начало диапазона — не дальше 3 месяцев вперёд, сам диапазон — до 60 дней.
      parameters:
        - name: from
          in: query
          required: true
          description: Домашний город
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          description: Город или аэропорт назначения
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          required: true
          description: Вылет не раньше этой даты — не дальше 3 месяцев от сегодня
          schema: { type: string, format: date, example: '2026-11-15' }
        - name: date_to
          in: query
          required: true
          description: Возврат не позже этой даты (не только вылет) — не дальше 60 дней от date_from
          schema: { type: string, format: date, example: '2026-11-22' }
        - name: min_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 3 }
        - name: max_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 14 }
        - $ref: '#/components/parameters/Travelers'
        - name: weekends
          in: query
          description: Только поездки на выходные — вылет в чт–сб, возвращение в вс–пн (по местному времени)
          schema: { type: boolean, default: false }
        - name: use_car
          in: query
          description: Есть машина — искать и в соседних аэропортах
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/MaxDriveHours'
        - $ref: '#/components/parameters/ConsumptionL100'
        - $ref: '#/components/parameters/FuelTypeParam'
        - $ref: '#/components/parameters/FuelPriceRub'
        - $ref: '#/components/parameters/AllowBorder'
        - $ref: '#/components/parameters/Via'
      responses:
        '200':
          description: Варианты поездки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripsResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /trips/stops:
    get:
      tags: [search]
      operationId: suggestStops
      summary: Города, где можно остановиться по дороге на машине
      description: |
        Города карты вдоль дороги от дома до места: небольшой крюк, интересные (население, герб, фото,
        достопримечательность), с ценой ночёвки. Лучшие сверху. Если дорога длиннее max_drive_hours,
        выше те, где удобно заночевать: оба участка не длиннее лимита. См. ADR-0023.
      parameters:
        - name: from
          in: query
          required: true
          description: Домашний город
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          description: Город назначения
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/MaxDriveHours'
      responses:
        '200':
          description: Предложения, лучшие сверху; пусто — подходящих городов нет
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopSuggestions' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /explore:
    get:
      tags: [search]
      operationId: exploreDestinations
      summary: Куда угодно — самые дешёвые поездки из дома во все города
      description: |
        Для каждого города, куда у источника есть цены на выбранные даты, — самый дешёвый вариант по полной
        стоимости (билеты на всех + машина до соседнего аэропорта, если use_car) и лучший вылет из своего города.
        С машиной перелёт предлагается, только если он дешевле поездки целиком на машине или заметно быстрее;
        поездка на машине до города — в drive (реальная дорога).
        Ограничения дат — как у /trips. Поездки целиком на машине здесь не считаются — их оценивает клиент
        по своему справочнику городов. Сортировка — по полной стоимости на всех.
      parameters:
        - name: from
          in: query
          required: true
          description: Домашний город
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-11-15' }
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-12-15' }
        - name: min_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 3 }
        - name: max_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 14 }
        - $ref: '#/components/parameters/Travelers'
        - name: weekends
          in: query
          description: Только поездки на выходные — вылет в чт–сб, возвращение в вс–пн (по местному времени)
          schema: { type: boolean, default: false }
        - name: use_car
          in: query
          description: Есть машина — вылеты и из соседних аэропортов
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/MaxDriveHours'
        - $ref: '#/components/parameters/ConsumptionL100'
        - $ref: '#/components/parameters/FuelTypeParam'
        - $ref: '#/components/parameters/FuelPriceRub'
        - $ref: '#/components/parameters/AllowBorder'
      responses:
        '200':
          description: Направления, дешёвые первыми
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExploreResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /stay-prices:
    get:
      tags: [search]
      operationId: listStayPrices
      summary: Ориентировочная цена жилья по городам карты
      description: |
        Средняя цена суток в гостинице 3* с человека по данным Росстата (ЕМИСС): своя для городов наблюдения,
        для остальных городов России — ближайшего города наблюдения (до 250 км) или средняя по России.
        Зарубежных городов нет. Ключ — Wikidata ID города карты (cities.geojson). Обновляется командой
        stay-update; ответ кэшируется в Redis.
      responses:
        '200':
          description: Цены по городам
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StayPricesResponse' }

  /weather:
    get:
      tags: [search]
      operationId: getWeather
      summary: Погода на даты поездки в точке
      description: |
        По дням: ближайшие 16 дней — прогноз Open-Meteo (source = forecast), дальше — «обычно в эти дни»
        (source = climate): средние по наблюдениям за 5 прошлых лет в окне ±3 дня. Ответы источника кэшируются
        в Redis по сетке 0,1°; свежесть проверяется при чтении: прогноз — 6 часов, норма — 30 дней. Если источник
        недоступен, отдаётся устаревшее из кэша со stale = true. Даты — местные для точки.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - { name: date_from, in: query, required: true, schema: { type: string, format: date } }
        - name: date_to
          in: query
          required: true
          description: Включительно; диапазон — не больше 62 дней
          schema: { type: string, format: date }
      responses:
        '200':
          description: Погода по дням
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherResponse' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /routes/drive:
    get:
      tags: [search]
      operationId: getDriveRoute
      summary: Линия маршрута на машине между двумя точками по координатам — для карты «Куда угодно»
      description: |
        Для точек не из справочника (города карты). Кэш — Redis на 30 дней; если маршрутизатор недоступен —
        прямая с approximate = true.
      parameters:
        - { name: from_lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: from_lon, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - { name: to_lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: to_lon, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: Маршрут
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoadRoute' }
        '422': { $ref: '#/components/responses/Problem' }

  /routes/road:
    get:
      tags: [search]
      operationId: getRoadRoute
      summary: Линия маршрута на машине между двумя точками — для карты
      description: |
        Геометрия кэшируется. Если маршрутизатор недоступен, возвращается прямая между точками
        с approximate = true. via — места из путевого листа, куда заехать по пути: путь проходит через них
        в указанном порядке, расстояние и время — с заездами; такой путь не кэшируется.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: via
          in: query
          required: false
          description: Промежуточные точки «широта,долгота», по порядку; параметр повторяется
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, pattern: '^-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?$', example: '53.2415,50.2212' }
      responses:
        '200':
          description: Маршрут
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoadRoute' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /routes/road/pois:
    get:
      tags: [map]
      operationId: listRoadPois
      summary: Заправки, кафе и достопримечательности вдоль дороги
      description: |
        Заправки и кафе — до 2,5 км от дороги, достопримечательности — до 5 км.
        Первый запрос по дороге может идти несколько секунд — данные загружаются из OpenStreetMap.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Места
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoiList' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /geocode:
    get:
      tags: [transfers]
      operationId: geocode
      summary: Поиск адреса (например, квартиры) рядом с городом
      description: |
        Адреса из OpenStreetMap (Photon). Поиск привязан к городу: результаты дальше ~60 км от него отбрасываются.
        Точность адресов в OSM разная по странам — показываем несколько вариантов, пользователь выбирает и при
        необходимости поправляет точку на карте.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 200 }
        - name: near
          in: query
          required: true
          description: Город, рядом с которым искать
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Найденные адреса, лучшие первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /transfers:
    get:
      tags: [transfers]
      operationId: listTransfers
      summary: Как добраться внутри города — например, из аэропорта до квартиры
      description: |
        Несколько вариантов: такси, общественный транспорт, пешком (если близко). Расстояние и время такси —
        по дороге (OSRM). Цена такси и маршруты общественного транспорта появляются, когда настроены
        ключи Яндекс Такси и 2ГИС; без них — ссылки, открывающие маршрут в Яндекс Картах, 2ГИС и Яндекс Go.
      parameters:
        - { name: from_lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: from_lon, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - { name: to_lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: to_lon, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - name: country
          in: query
          description: Страна (ISO 3166-1) — для ссылок на 2ГИС нужного домена
          schema: { type: string, minLength: 2, maxLength: 2 }
        - $ref: '#/components/parameters/Travelers'
      responses:
        '200':
          description: Варианты, быстрые первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TransferOption' }
        '422': { $ref: '#/components/responses/Problem' }

  /favorites:
    get:
      tags: [favorites]
      operationId: listFavorites
      summary: Избранные маршруты текущего пользователя
      description: |
        Пока нет авторизации, владелец — анонимная сессия (cookie klubok_sid, выдаётся сервером).
        Цены в списке — на момент сохранения; актуальные — GET /favorites/{id}/current.
      responses:
        '200':
          description: Избранное, новые первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Favorite' }
    post:
      tags: [favorites]
      operationId: addFavorite
      summary: Добавить маршрут в избранное
      description: Тот же вариант с теми же параметрами уже есть — возвращается существующая запись (200).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoriteCreate' }
      responses:
        '201':
          description: Добавлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorite' }
        '200':
          description: Уже было в избранном
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorite' }
        '422': { $ref: '#/components/responses/Problem' }

  /favorites/{id}:
    patch:
      tags: [favorites]
      operationId: updateFavorite
      summary: Поменять остановки по пути у сохранённой поездки
      description: |
        via заменяет остановки по дороге на машине (как параметр via у GET /trips, ADR-0023). Цена сразу
        пересчитывается, и снимок цены обновляется: поменять маршрут — не значит «подорожало». 409 — поездка
        с такими остановками уже есть в избранном.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoritePatch' }
      responses:
        '200':
          description: Запись и пересчитанный вариант
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoriteUpdated' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [favorites]
      operationId: deleteFavorite
      summary: Убрать из избранного
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Удалено }
        '404': { $ref: '#/components/responses/Problem' }

  /favorites/{id}/current:
    get:
      tags: [favorites]
      operationId: getFavoriteCurrent
      summary: Актуальная цена избранного маршрута
      description: |
        Повторяет сохранённый поиск с сохранёнными параметрами и ищет тот же вариант (аэропорт и даты
        или «на машине»). status: found — тот же вариант; replaced — его нет, показан лучший с теми же
        параметрами; past — даты поездки прошли; empty — вариантов нет; unavailable — источник цен недоступен.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Пересчитанный вариант
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoriteCurrent' }
        '404': { $ref: '#/components/responses/Problem' }

  /link-preview:
    get:
      tags: [favorites]
      operationId: getLinkPreview
      summary: Превью ссылки для путевого листа — название, картинка, цена за сутки
      description: |
        Читает og-теги страницы. Только сайты из белого списка (Суточно.ру, Островок, 101 Отель, Твил, Трипстер,
        Спутник8, Localrent): сервер не ходит по произвольным адресам. Авито закрыт для ботов — 404.
        per_night — цена за сутки, если сайт пишет её в описании (Суточно.ру). Кэш — 12 часов.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, maxLength: 2000, pattern: '^https?://' }
      responses:
        '200':
          description: Превью
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkPreview' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /favorites/{id}/items:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [favorites]
      operationId: listTripItems
      summary: Путевой лист сохранённой поездки
      description: |
        Пункты, которые пользователь добавил к поездке: выбранное жильё, аренда машины, места по пути, дела.
        Каждый привязан к этапу поездки (stage), порядок — по времени добавления.
      responses:
        '200':
          description: Пункты путевого листа
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TripItem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [favorites]
      operationId: addTripItem
      summary: Добавить пункт в путевой лист
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripItemCreate' }
      responses:
        '201':
          description: Добавлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripItem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /favorites/{id}/items/{item_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: item_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [favorites]
      operationId: updateTripItem
      summary: Отметить выполненным, переименовать, поменять цену
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripItemPatch' }
      responses:
        '200':
          description: Изменённый пункт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripItem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [favorites]
      operationId: deleteTripItem
      summary: Удалить пункт
      responses:
        '204': { description: Удалено }
        '404': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    Via:
      name: via
      in: query
      required: false
      description: |
        Остановки по дороге на машине, по порядку: «<id города карты>:<ночей>», параметр повторяется.
        0 ночей — заезд на несколько часов. Учитываются только в варианте «целиком на машине».
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, pattern: '^Q\d+:[0-3]$', example: 'Q900:1' }
    RadiusKm:
      name: radius_km
      in: query
      schema: { type: integer, minimum: 0, maximum: 1000, default: 100 }
    MaxDriveHours:
      name: max_drive_hours
      in: query
      description: Максимум часов за рулём в одну сторону; 0 — без ограничения
      schema: { type: number, format: double, minimum: 0, maximum: 24, default: 8 }
    Travelers:
      name: travelers
      in: query
      schema: { type: integer, minimum: 1, maximum: 9, default: 1 }
    ConsumptionL100:
      name: consumption_l100
      in: query
      description: Расход топлива, л/100 км
      schema: { type: number, format: double, minimum: 2, maximum: 30, default: 8 }
    FuelTypeParam:
      name: fuel_type
      in: query
      schema: { $ref: '#/components/schemas/FuelType' }
    FuelPriceRub:
      name: fuel_price_rub
      in: query
      description: Своя цена топлива за литр; если не задана — из справочника
      schema: { type: number, format: double, minimum: 1, maximum: 1000 }
    AllowBorder:
      name: allow_border
      in: query
      description: Учитывать аэропорты в другой стране
      schema: { type: boolean, default: false }
    PlaceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    PlaceKind:
      type: string
      description: town — город без аэропорта (город карты, iata — id Wikidata), туда только на машине
      enum: [city, airport, town]

    Place:
      type: object
      required: [id, kind, iata, name, country_code, location, timezone]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PlaceKind' }
        iata: { type: string, example: KUF }
        city_iata:
          type: string
          description: Код города, к которому относится аэропорт
          example: KUF
        city_name:
          type: string
          description: Название города, к которому относится аэропорт
          example: Самара
        name: { type: string, example: Самара }
        name_en: { type: string, example: Samara }
        name_to:
          type: string
          description: Название в винительном падеже с предлогом
          example: в Самару
        country_code: { type: string, example: RU }
        location: { $ref: '#/components/schemas/Point' }
        timezone: { type: string, example: Europe/Samara }

    Money:
      type: object
      description: Сумма в минимальных единицах валюты (копейках)
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, example: 327360 }
        currency: { type: string, enum: [RUB] }

    FuelType:
      type: string
      enum: [ai92, ai95, dt, lpg]
      default: ai95

    CarHubsResponse:
      type: object
      required: [home, fuel_price, fuel_price_source, items]
      properties:
        home: { $ref: '#/components/schemas/Place' }
        fuel_price: { $ref: '#/components/schemas/Money' }
        fuel_price_source:
          type: string
          enum: [reference, user]
          description: reference — цена из справочника, user — задана пользователем
        items:
          type: array
          items: { $ref: '#/components/schemas/CarHub' }

    CarHub:
      type: object
      required: [place, straight_km, road, drive_hours, cost, per_person, parking_estimated]
      properties:
        place: { $ref: '#/components/schemas/Place' }
        straight_km: { type: number, format: double }
        road: { $ref: '#/components/schemas/RoadLeg' }
        drive_hours:
          type: number
          format: double
          description: Время в пути в одну сторону, включая время на границе
        cost: { $ref: '#/components/schemas/CarCost' }
        per_person: { $ref: '#/components/schemas/Money' }
        parking_estimated:
          type: boolean
          description: Цена парковки неизвестна, взято значение по умолчанию
        border: { $ref: '#/components/schemas/BorderInfo' }

    RoadLeg:
      type: object
      required: [distance_km, duration_min, approximate]
      properties:
        distance_km: { type: number, format: double }
        duration_min: { type: integer }
        approximate:
          type: boolean
          description: Оценка по прямой — маршрутизатор был недоступен

    CarCost:
      type: object
      description: Расходы на машину туда и обратно на всю группу
      required: [fuel, parking, border, total]
      properties:
        fuel: { $ref: '#/components/schemas/Money' }
        parking: { $ref: '#/components/schemas/Money' }
        border: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }

    BorderInfo:
      type: object
      required: [insurance, crossing_hours, note]
      properties:
        insurance: { $ref: '#/components/schemas/Money' }
        crossing_hours: { type: number, format: double }
        note: { type: string }

    ExploreResponse:
      type: object
      required: [home, items, partial, drive_better]
      properties:
        home: { $ref: '#/components/schemas/Place' }
        fuel_price: { $ref: '#/components/schemas/Money' }
        partial:
          type: boolean
          description: Часть запросов к источнику цен не удалась
        border_rules:
          type: array
          description: Правила въезда на машине в другие страны (если use_car и allow_border) — для поездок на машине в соседние страны
          items: { $ref: '#/components/schemas/BorderRule' }
        drive_better:
          type: integer
          description: |
            Сколько городов убрано: перелёты туда есть, но на машине дешевле и не намного дольше
            (перелёт предлагается, только если он дешевле машины или от двери до места минимум на четверть быстрее)
        items:
          type: array
          items: { $ref: '#/components/schemas/ExploreItem' }

    BorderRule:
      type: object
      required: [country_code, insurance, crossing_hours, note]
      properties:
        country_code: { type: string, example: KZ }
        insurance: { $ref: '#/components/schemas/Money' }
        crossing_hours: { type: number, format: double }
        note: { type: string }

    ExploreItem:
      type: object
      required: [city, best]
      properties:
        city: { $ref: '#/components/schemas/Place' }
        best:
          $ref: '#/components/schemas/TripOption'
        home_best:
          $ref: '#/components/schemas/TripOption'
        drive:
          $ref: '#/components/schemas/DriveTrip'

    StayPricesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StayPrice' }

    WeatherDay:
      type: object
      required: [date, source, code, t_max, t_min, precip_mm]
      properties:
        date: { type: string, format: date }
        source:
          type: string
          enum: [forecast, climate]
          description: forecast — прогноз; climate — обычно в эти дни (средние за 5 лет)
        code: { type: integer, description: 'Код погоды WMO: 0 ясно, 1–3 облачно, 45/48 туман, 51–67 и 80–82 дождь, 71–77 и 85–86 снег, 95–99 гроза' }
        t_max: { type: number, format: double, description: Максимум днём, °C }
        t_min: { type: number, format: double, description: Минимум ночью, °C }
        precip_mm: { type: number, format: double, description: Осадки за сутки, мм (у climate — в среднем) }
        precip_probability: { type: integer, description: 'Вероятность осадков, % (только forecast)' }
        wet_share: { type: number, format: double, description: 'Доля дней с осадками от 1 мм в эти даты, 0–1 (только climate)' }

    WeatherResponse:
      type: object
      required: [days, stale, attribution]
      properties:
        days:
          type: array
          items: { $ref: '#/components/schemas/WeatherDay' }
        stale: { type: boolean, description: Источник недоступен — данные из кэша старше срока }
        attribution: { type: string, example: 'Open-Meteo.com' }

    StayPrice:
      type: object
      required: [city_id, per_night, category, source, basis, period]
      properties:
        city_id: { type: string, example: Q1781 }
        per_night:
          $ref: '#/components/schemas/Money'
        category: { type: string, enum: [hotel3], description: hotel3 — гостиница 3*, сутки с человека }
        source: { type: string, enum: [rosstat] }
        basis:
          type: string
          description: Чья это цена — город наблюдения Росстата («Сызрань») или «Россия» (средняя)
          example: Самара
        period: { type: string, format: date, description: Месяц наблюдения (1-е число) }

    TripsResponse:
      type: object
      required: [home, destination, options, no_data, partial, hidden_flights]
      properties:
        home: { $ref: '#/components/schemas/Place' }
        destination: { $ref: '#/components/schemas/Place' }
        fuel_price: { $ref: '#/components/schemas/Money' }
        options:
          type: array
          description: Лучший вариант через каждый аэропорт, дешёвые первыми
          items: { $ref: '#/components/schemas/TripOption' }
        home_best:
          $ref: '#/components/schemas/TripOption'
        no_data:
          type: array
          description: Аэропорты, по которым у источника нет цен на эти даты
          items: { $ref: '#/components/schemas/Place' }
        partial:
          type: boolean
          description: Часть запросов к источнику цен не удалась
        drive: { $ref: '#/components/schemas/DriveTrip' }
        drive_skipped:
          type: string
          enum: [too_long, border_not_allowed, no_road]
          description: Почему нет варианта на машине (если use_car)
        hidden_flights:
          type: integer
          description: Сколько перелётов скрыто — не дешевле и не заметно быстрее машины

    DriveTrip:
      type: object
      description: |
        Поездка целиком на своей машине, туда и обратно. Предлагается, если граница разрешена (allow_border)
        и дорога в одну сторону не дольше max_drive_hours; длиннее (до 4 дней по лимиту) — тоже, с предупреждением
        long_drive_day: где заехать и переночевать, пользователь выбирает сам (via, ADR-0023).
        Даты свободные; парковка на месте не считается.
      required: [road, drive_hours, cost, total, per_person, trip_days, warnings]
      properties:
        road: { $ref: '#/components/schemas/RoadLeg' }
        drive_hours: { type: number, format: double, description: В одну сторону, с учётом границы }
        cost: { $ref: '#/components/schemas/CarCost' }
        total: { $ref: '#/components/schemas/Money' }
        per_person: { $ref: '#/components/schemas/Money' }
        trip_days: { type: integer, description: Длительность для расчёта (min_days) }
        border: { $ref: '#/components/schemas/BorderInfo' }
        savings_vs_home:
          $ref: '#/components/schemas/Money'
        stops:
          type: array
          description: Остановки по пути (параметр via), по порядку; туда — через них, обратно — напрямую
          items: { $ref: '#/components/schemas/DriveStop' }
        via_road:
          $ref: '#/components/schemas/RoadLeg'
          description: Дорога туда через остановки; есть, только когда есть остановки
        stay:
          $ref: '#/components/schemas/Money'
          description: Ночёвки в остановках на всех — уже в total
        warnings:
          type: array
          items:
            type: string
            enum: [border_crossing_by_car, road_approximate, long_drive_day]
            description: long_drive_day — какой-то день за рулём дольше max_drive_hours (дорога длинная, ночёвок не хватает)

    StopCity:
      type: object
      description: Город карты (cities.geojson), id — Wikidata
      required: [id, name, location, population, arms]
      properties:
        id: { type: string, example: Q900 }
        name: { type: string, example: Казань }
        location: { $ref: '#/components/schemas/Point' }
        population: { type: integer }
        arms: { type: boolean, description: Есть герб — /data/arms/<id>.webp }
        photo: { type: string, description: Файл на Викискладе }
        landmark: { type: string, example: Казанский кремль }

    DriveStop:
      type: object
      required: [city, nights]
      properties:
        city: { $ref: '#/components/schemas/StopCity' }
        nights: { type: integer, minimum: 0, maximum: 3 }
        stay:
          $ref: '#/components/schemas/Money'
          description: Ночёвки на всех; нет — 0 ночей или нет цены
        stay_per_night:
          $ref: '#/components/schemas/Money'
          description: Сутки в гостинице 3* с человека (Росстат)

    StopSuggestion:
      type: object
      required: [city, detour, position, drive_to_hours, drive_from_hours, overnight]
      properties:
        city: { $ref: '#/components/schemas/StopCity' }
        detour:
          $ref: '#/components/schemas/RoadLeg'
          description: Сколько добавит заезд к прямой дороге
        position: { type: number, format: double, description: Доля пути до города, 0–1 }
        drive_to_hours: { type: number, format: double, description: От дома до города }
        drive_from_hours: { type: number, format: double, description: От города до места }
        overnight:
          type: boolean
          description: Дорога длиннее лимита, и здесь удобно заночевать — оба участка не длиннее лимита
        stay_per_night:
          $ref: '#/components/schemas/Money'
          description: Сутки в гостинице 3* с человека (Росстат)

    StopSuggestions:
      type: object
      required: [items, direct]
      properties:
        direct: { $ref: '#/components/schemas/RoadLeg' }
        items:
          type: array
          items: { $ref: '#/components/schemas/StopSuggestion' }

    TripOption:
      type: object
      required: [hub, depart_at, return_at, trip_days, days_there, airline, transfers, return_transfers,
                 duration_to_min, duration_back_min, ticket_per_person, tickets, total, per_person, warnings]
      properties:
        hub: { $ref: '#/components/schemas/Place' }
        arrival:  # аэропорт прилёта; нет — его нет в справочнике
          $ref: '#/components/schemas/Place'
        depart_at: { type: string, format: date-time }
        return_at: { type: string, format: date-time }
        trip_days: { type: integer }
        days_there:
          type: number
          format: double
          description: |
            Сколько дней на месте по светлому времени (8:00–22:00 местного): от прилёта плюс 1,5 ч на дорогу
            из аэропорта до вылета обратно минус 2,5 ч; 14 ч = день, округлено до половины. Прилёт в полночь
            и вылет в 8 утра — 0, хотя trip_days = 2. Варианты, где на месте меньше 40% светлого времени
            min_days, в выдачу не попадают.
        airline: { type: string, example: FS }
        transfers: { type: integer }
        return_transfers: { type: integer }
        duration_to_min: { type: integer }
        duration_back_min: { type: integer }
        found_on:
          type: string
          format: date
          description: Когда источник видел эту цену
        booking_url: { type: string }
        ticket_per_person:
          $ref: '#/components/schemas/Money'
        tickets:
          $ref: '#/components/schemas/Money'
        car: { $ref: '#/components/schemas/TripCar' }
        total: { $ref: '#/components/schemas/Money' }
        per_person: { $ref: '#/components/schemas/Money' }
        savings_vs_home:
          $ref: '#/components/schemas/Money'
        warnings:
          type: array
          items:
            type: string
            enum: [border_crossing_by_car, stale_price, parking_estimated, road_approximate]

    TripCar:
      type: object
      required: [road, drive_hours, cost]
      properties:
        road: { $ref: '#/components/schemas/RoadLeg' }
        drive_hours: { type: number, format: double }
        cost: { $ref: '#/components/schemas/CarCost' }
        border: { $ref: '#/components/schemas/BorderInfo' }

    HotelsProvider:
      type: string
      enum: [ostrovok, sutochno, avito]
      default: ostrovok

    HotelsLink:
      type: object
      required: [url, provider, partner]
      properties:
        url: { type: string }
        provider: { $ref: '#/components/schemas/HotelsProvider' }
        partner: { type: boolean, description: Ссылка с партнёрской меткой }

    RoadRoute:
      type: object
      required: [road, polyline]
      properties:
        road: { $ref: '#/components/schemas/RoadLeg' }
        polyline:
          type: string
          description: Линия маршрута в формате Encoded Polyline с точностью 6 знаков (как polyline6 в OSRM)

    PoiList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Poi' }

    Poi:
      type: object
      description: Место из OpenStreetMap
      required: [id, category, kind, location, details_pending]
      properties:
        id: { type: string, description: Объект OSM, example: node/123456 }
        category:
          type: string
          enum: [fuel, food, attraction]
        kind:
          type: string
          description: Значение тега OSM — fuel, cafe, restaurant, fast_food, museum, viewpoint, castle…
          example: cafe
        name: { type: string }
        brand: { type: string, example: Лукойл }
        location: { $ref: '#/components/schemas/Point' }
        opening_hours: { type: string, description: Часы работы в формате OSM, example: 'Mo-Su 08:00-22:00' }
        website: { type: string }
        wikipedia: { type: string, description: 'Статья: язык и название', example: 'ru:Самарская площадь' }
        wikidata: { type: string, example: Q4140541 }
        cuisine:
          type: array
          description: Кухня, значения OSM
          items: { type: string, example: pizza }
        phone: { type: string }
        fee:
          type: string
          description: Плата за вход — yes, no или сумма, как указано в OSM
          example: 300 RUB
        description: { type: string, description: Первые предложения статьи Википедии или описание из Wikidata }
        photo: { $ref: '#/components/schemas/Photo' }
        details_pending:
          type: boolean
          description: Описание и фото ещё не загружались — их даст GET /pois/{type}/{id}

    Guide:
      type: object
      required: [source, title, url, license, listings]
      properties:
        source: { type: string, enum: [wikivoyage] }
        title: { type: string, example: Уральск }
        url: { type: string, description: Статья — для подписи «по материалам Викигида» }
        overview: { type: string, description: Вступление и начало раздела «Понять» }
        license: { type: string, example: CC BY-SA 4.0 }
        listings:
          type: array
          items: { $ref: '#/components/schemas/GuideListing' }

    GuideListing:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [see, do, eat, drink, sleep, buy, go, other]
          description: see — посмотреть, do — заняться, eat — еда, drink — бары, sleep — жильё, buy — покупки, go — транспорт
        name: { type: string }
        alt: { type: string }
        description: { type: string }
        address: { type: string }
        url: { type: string }
        hours: { type: string }
        price: { type: string }
        location: { $ref: '#/components/schemas/Point' }
        wikidata: { type: string }
        photo: { $ref: '#/components/schemas/Photo' }

    Photo:
      type: object
      description: Фото с Wikimedia Commons
      required: [url, page]
      properties:
        url: { type: string, description: Уменьшенная копия, 640 px по ширине }
        page: { type: string, description: Страница файла — автор и лицензия }
        credit: { type: string, example: 'Иван Иванов · CC BY-SA 4.0' }

    Address:
      type: object
      required: [label, location]
      properties:
        label: { type: string, example: 'Абай даңғылы 10, Алматы' }
        location: { $ref: '#/components/schemas/Point' }
        kind:
          type: string
          description: house — дом, street — только улица (точку стоит поправить)
          example: house
        distance_km:
          type: number
          format: double
          description: Расстояние от центра города

    TransferOption:
      type: object
      required: [mode, title, links]
      properties:
        mode:
          type: string
          enum: [taxi, public_transport, walk]
        title: { type: string, example: Такси }
        duration_min:
          type: integer
          description: Время в пути; нет — неизвестно без внешнего сервиса
        distance_km: { type: number, format: double }
        price: { $ref: '#/components/schemas/Money' }
        price_note:
          type: string
          description: Пояснение к цене, если её нет или она ориентировочная
        approximate:
          type: boolean
          description: Время или расстояние посчитаны приблизительно
        links:
          type: array
          description: Где открыть или заказать маршрут
          items:
            type: object
            required: [title, url]
            properties:
              title: { type: string, example: Яндекс Карты }
              url: { type: string }

    TripSearchParams:
      type: object
      description: Параметры поиска поездки — те же, что у запроса GET /trips
      required: [from, to, date_from, date_to]
      properties:
        from: { type: string, format: uuid }
        to: { type: string, format: uuid }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        min_days: { type: integer, minimum: 1, maximum: 60 }
        max_days: { type: integer, minimum: 1, maximum: 60 }
        travelers: { type: integer, minimum: 1, maximum: 9 }
        use_car: { type: boolean }
        radius_km: { type: integer, minimum: 0, maximum: 1000 }
        max_drive_hours: { type: number, format: double, minimum: 0, maximum: 24 }
        consumption_l100: { type: number, format: double, minimum: 2, maximum: 30 }
        fuel_type: { $ref: '#/components/schemas/FuelType' }
        fuel_price_rub: { type: number, format: double, minimum: 1, maximum: 1000 }
        allow_border: { type: boolean }
        weekends: { type: boolean, description: Только вылет чт–сб и возвращение вс–пн }
        via:
          type: array
          description: Остановки по дороге на машине — как параметр via у GET /trips
          items: { type: string, pattern: '^Q\d+:[0-3]$' }

    FavoritePick:
      type: object
      description: Какой вариант выбран в результатах
      required: [kind]
      properties:
        kind:
          type: string
          enum: [flight, drive]
        hub_iata: { type: string, description: Аэропорт вылета (для flight), example: URA }
        depart_date: { type: string, format: date }
        return_date: { type: string, format: date }

    FavoriteSnapshot:
      type: object
      description: Вариант на момент сохранения — для «было → стало» и показа без пересчёта
      required: [total, per_person]
      properties:
        total: { $ref: '#/components/schemas/Money' }
        per_person: { $ref: '#/components/schemas/Money' }
        hub_name: { type: string }
        depart_at: { type: string, format: date-time }
        return_at: { type: string, format: date-time }
        trip_days: { type: integer }
        transfers: { type: integer }
        drive_hours: { type: number, format: double }
        found_on: { type: string, format: date }

    FavoritePatch:
      type: object
      required: [via]
      properties:
        via:
          type: array
          description: Остановки по пути — как via у GET /trips; пусто — без остановок
          items: { type: string, pattern: '^Q\d+:[0-3]$' }

    FavoriteUpdated:
      type: object
      required: [favorite, current]
      properties:
        favorite: { $ref: '#/components/schemas/Favorite' }
        current: { $ref: '#/components/schemas/FavoriteCurrent' }

    FavoriteCreate:
      type: object
      required: [title, params, pick, snapshot]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: 'Самара → Алматы, ноябрь' }
        params: { $ref: '#/components/schemas/TripSearchParams' }
        pick: { $ref: '#/components/schemas/FavoritePick' }
        snapshot: { $ref: '#/components/schemas/FavoriteSnapshot' }

    Favorite:
      type: object
      required: [id, title, params, pick, snapshot, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        params: { $ref: '#/components/schemas/TripSearchParams' }
        pick: { $ref: '#/components/schemas/FavoritePick' }
        snapshot: { $ref: '#/components/schemas/FavoriteSnapshot' }
        created_at: { type: string, format: date-time }

    FavoriteCurrent:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [found, replaced, past, empty, unavailable]
        result:
          $ref: '#/components/schemas/TripsResponse'
        option:
          $ref: '#/components/schemas/TripOption'
        drive:
          $ref: '#/components/schemas/DriveTrip'
        total: { $ref: '#/components/schemas/Money' }
        diff:
          $ref: '#/components/schemas/Money'

    LinkPreview:
      type: object
      required: [site]
      properties:
        site: { type: string, example: Суточно.ру }
        title: { type: string }
        description: { type: string }
        image_url: { type: string }
        per_night: { $ref: '#/components/schemas/Money' }

    TripItemStage:
      type: string
      description: |
        Этап поездки: prep — сборы до выезда, road — дорога туда, flight — вылет, stay — проживание,
        see — что посмотреть на месте, place — услуги на месте (аренда машины, трансфер),
        return — возвращение, home — дорога домой.
      enum: [prep, road, flight, stay, see, place, return, home]
      x-enum-varnames: [StagePrep, StageRoad, StageFlight, StageStay, StageSee, StagePlace, StageReturn, StageHome]

    TripItemKind:
      type: string
      description: note — заметка или дело; link — страница на другом сайте (объявление, отель, аренда); place — место, куда заехать
      enum: [note, link, place]
      x-enum-varnames: [KindNote, KindLink, KindPlace]

    TripItemCreate:
      type: object
      required: [stage, kind, title]
      properties:
        stage: { $ref: '#/components/schemas/TripItemStage' }
        kind: { $ref: '#/components/schemas/TripItemKind' }
        title: { type: string, minLength: 1, maxLength: 300, example: 'Заехать на озеро Белё' }
        url: { type: string, maxLength: 2000, pattern: '^https?://', example: 'https://sutochno.ru/front/searchapp/detail/123456' }
        price: { $ref: '#/components/schemas/Money' }
        location:
          description: Где это место — чтобы показать на карте и проложить дорогу через него
          allOf: [{ $ref: '#/components/schemas/Point' }]
        image_url: { type: string, maxLength: 2000, pattern: '^https://', description: Картинка из превью ссылки }
        description: { type: string, maxLength: 500, description: Описание из превью ссылки }
        city:
          type: string
          pattern: '^Q\d+$'
          description: Город-остановка по пути (id Wikidata, как в via) — жильё и дела в нём; нет — место назначения или дорога

    TripItemPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        done: { type: boolean }
        price: { $ref: '#/components/schemas/Money' }
        clear_price: { type: boolean, description: 'true — убрать цену' }
        image_url: { type: string, maxLength: 2000, pattern: '^https://', description: Картинка из превью — для ссылок, добавленных без него }
        description: { type: string, maxLength: 500 }

    TripItem:
      type: object
      required: [id, stage, kind, title, done, created_at]
      properties:
        id: { type: string, format: uuid }
        stage: { $ref: '#/components/schemas/TripItemStage' }
        kind: { $ref: '#/components/schemas/TripItemKind' }
        title: { type: string }
        url: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        location: { $ref: '#/components/schemas/Point' }
        image_url: { type: string }
        description: { type: string }
        city: { type: string, description: Город-остановка по пути (id Wikidata); нет — место назначения или дорога }
        done:
          type: boolean
          description: Для ссылок (жильё, аренда) — «выбрано»; цена ссылки идёт в итог, только когда она выбрана
        created_at: { type: string, format: date-time }

    Point:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double }
        lon: { type: number, format: double }

    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
