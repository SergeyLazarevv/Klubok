openapi: 3.0.3
info:
  title: Klubok API
  version: 0.1.0
  description: |
    API сервиса планирования путешествий Klubok.
    Обзор и правила — docs/08-api.md. Этот файл — источник истины для контракта.
servers:
  - url: /api/v1

tags:
  - name: places
    description: Справочник городов и транспортных узлов
  - name: search
    description: Подбор вариантов поездки
  - name: map
    description: Места на карте из OpenStreetMap
  - name: transfers
    description: Как добраться внутри города — из аэропорта или с вокзала до жилья
  - name: favorites
    description: Избранные маршруты; до авторизации — по анонимной сессии

paths:
  /places:
    get:
      tags: [places]
      operationId: searchPlaces
      summary: Автодополнение точек по названию или IATA-коду
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
          description: Начало названия (ru/en) или IATA-код
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PlaceKind' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Найденные точки, лучшие совпадения первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Place' }
        '422': { $ref: '#/components/responses/Problem' }

  /places/{id}:
    get:
      tags: [places]
      operationId: getPlace
      summary: Точка по идентификатору
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Точка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '404': { $ref: '#/components/responses/Problem' }

  /places/{id}/pois:
    get:
      tags: [map]
      operationId: listPlacePois
      summary: Достопримечательности вокруг точки
      description: В радиусе 15 км. Первый запрос по точке может идти несколько секунд — данные загружаются из OpenStreetMap.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Места
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoiList' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /places/{id}/guide:
    get:
      tags: [map]
      operationId: getPlaceGuide
      summary: Путеводитель по городу — обзор и места, отобранные авторами Викигида
      description: |
        Для аэропорта — его город. Статья загружается при первом запросе и проверяется раз в 30 дней
        (ревизия не менялась — не разбирается заново). Источник и лицензию нужно показывать рядом с данными.
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Путеводитель
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Guide' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /pois/{type}/{id}:
    get:
      tags: [map]
      operationId: getPoi
      summary: Место с подробностями — описание и фото
      description: |
        Описание и фото берутся из Wikidata, Википедии и Wikimedia Commons при первом запросе и сохраняются.
        Если Википедия не ответила — место возвращается без них (details_pending остаётся true).
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [node, way, relation] }
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Место
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poi' }
        '404': { $ref: '#/components/responses/Problem' }

  /hotels/link:
    get:
      tags: [search]
      operationId: getHotelsLink
      summary: Ссылка на поиск жилья — отели Островка или квартиры посуточно на Авито
      description: |
        Для аэропорта берётся его город. Если в Travelpayouts подключена программа Островка (TRAVELPAYOUTS_TRS),
        ссылка партнёрская. Город не нашёлся на Островке — ссылка на страницу страны.
        Авито — раздел «Квартиры посуточно» в городе; для городов не в России — 404.
      parameters:
        - name: place
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: check_in
          in: query
          required: true
          schema: { type: string, format: date }
        - name: check_out
          in: query
          required: true
          schema: { type: string, format: date }
        - name: provider
          in: query
          description: 'Где искать: ostrovok — отели, avito — квартиры посуточно (только Россия, без дат — их выбирают на Авито)'
          schema: { $ref: '#/components/schemas/HotelsProvider' }
        - $ref: '#/components/parameters/Travelers'
      responses:
        '200':
          description: Ссылка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelsLink' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /hotels/go:
    get:
      tags: [search]
      operationId: goToHotels
      summary: Переход на поиск жилья — то же, что /hotels/link, но перенаправлением
      description: 'Для кнопки «Найти отель» — ссылку не нужно получать заранее, а Островок проверяет адрес города медленно.'
      parameters:
        - name: place
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: check_in
          in: query
          required: true
          schema: { type: string, format: date }
        - name: check_out
          in: query
          required: true
          schema: { type: string, format: date }
        - name: provider
          in: query
          description: 'Где искать: ostrovok — отели, avito — квартиры посуточно (только Россия, без дат — их выбирают на Авито)'
          schema: { $ref: '#/components/schemas/HotelsProvider' }
        - $ref: '#/components/parameters/Travelers'
      responses:
        '302':
          description: Перенаправление на Островок или Авито
          headers:
            Location:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /car-hubs:
    get:
      tags: [search]
      operationId: listCarHubs
      summary: Аэропорты, до которых можно доехать на машине, и расходы на дорогу
      description: |
        Для каждого аэропорта в радиусе — расстояние и время по дороге, расходы на машину туда и обратно
        (топливо, парковка на время поездки, страховка при въезде в другую страну). Сортировка — по времени в пути с учётом границы.
        Аэропорты, до которых ехать дольше max_drive_hours (с учётом времени на границе), не возвращаются.
      parameters:
        - name: from
          in: query
          required: true
          description: Домашний город
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/MaxDriveHours'
        - name: days
          in: query
          description: Длительность поездки в сутках — для парковки
          schema: { type: integer, minimum: 1, maximum: 60, default: 7 }
        - $ref: '#/components/parameters/Travelers'
        - $ref: '#/components/parameters/ConsumptionL100'
        - $ref: '#/components/parameters/FuelTypeParam'
        - $ref: '#/components/parameters/FuelPriceRub'
        - $ref: '#/components/parameters/AllowBorder'
      responses:
        '200':
          description: Хабы с расходами на машину
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarHubsResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /trips:
    get:
      tags: [search]
      operationId: searchTrips
      summary: Самые дешёвые поездки туда и обратно с учётом дороги до соседних аэропортов
      description: |
        Для каждого доступного аэропорта вылета — лучший по полной стоимости вариант: билеты на всех
        + машина (бензин, парковка на фактические дни поездки, страховка). Сортировка — по полной стоимости.
        Цены — из кэша поисков Aviasales, поэтому ищем по месяцу и длительности, а не по точным датам.
      parameters:
        - name: from
          in: query
          required: true
          description: Домашний город
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          description: Город или аэропорт назначения
          schema: { type: string, format: uuid }
        - name: month
          in: query
          required: true
          description: Месяц вылета
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-11' }
        - name: min_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 3 }
        - name: max_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 14 }
        - $ref: '#/components/parameters/Travelers'
        - name: use_car
          in: query
          description: Есть машина — искать и в соседних аэропортах
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/RadiusKm'
        - $ref: '#/components/parameters/MaxDriveHours'
        - $ref: '#/components/parameters/ConsumptionL100'
        - $ref: '#/components/parameters/FuelTypeParam'
        - $ref: '#/components/parameters/FuelPriceRub'
        - $ref: '#/components/parameters/AllowBorder'
      responses:
        '200':
          description: Варианты поездки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripsResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /routes/road:
    get:
      tags: [search]
      operationId: getRoadRoute
      summary: Линия маршрута на машине между двумя точками — для карты
      description: |
        Геометрия кэшируется. Если маршрутизатор недоступен, возвращается прямая между точками
        с approximate = true.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Маршрут
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoadRoute' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /routes/road/pois:
    get:
      tags: [map]
      operationId: listRoadPois
      summary: Заправки, кафе и достопримечательности вдоль дороги
      description: |
        Заправки и кафе — до 2,5 км от дороги, достопримечательности — до 5 км.
        Первый запрос по дороге может идти несколько секунд — данные загружаются из OpenStreetMap.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: to
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Места
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoiList' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /geocode:
    get:
      tags: [transfers]
      operationId: geocode
      summary: Поиск адреса (например, квартиры) рядом с городом
      description: |
        Адреса из OpenStreetMap (Photon). Поиск привязан к городу: результаты дальше ~60 км от него отбрасываются.
        Точность адресов в OSM разная по странам — показываем несколько вариантов, пользователь выбирает и при
        необходимости поправляет точку на карте.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 200 }
        - name: near
          in: query
          required: true
          description: Город, рядом с которым искать
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Найденные адреса, лучшие первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /transfers:
    get:
      tags: [transfers]
      operationId: listTransfers
      summary: Как добраться внутри города — например, из аэропорта до квартиры
      description: |
        Несколько вариантов: такси, общественный транспорт, пешком (если близко). Расстояние и время такси —
        по дороге (OSRM). Цена такси и маршруты общественного транспорта появляются, когда настроены
        ключи Яндекс Такси и 2ГИС; без них — ссылки, открывающие маршрут в Яндекс Картах, 2ГИС и Яндекс Go.
      parameters:
        - { name: from_lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: from_lon, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - { name: to_lat, in: query, required: true, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { name: to_lon, in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
        - name: country
          in: query
          description: Страна (ISO 3166-1) — для ссылок на 2ГИС нужного домена
          schema: { type: string, minLength: 2, maxLength: 2 }
        - $ref: '#/components/parameters/Travelers'
      responses:
        '200':
          description: Варианты, быстрые первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TransferOption' }
        '422': { $ref: '#/components/responses/Problem' }

  /favorites:
    get:
      tags: [favorites]
      operationId: listFavorites
      summary: Избранные маршруты текущего пользователя
      description: |
        Пока нет авторизации, владелец — анонимная сессия (cookie klubok_sid, выдаётся сервером).
        Цены в списке — на момент сохранения; актуальные — GET /favorites/{id}/current.
      responses:
        '200':
          description: Избранное, новые первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Favorite' }
    post:
      tags: [favorites]
      operationId: addFavorite
      summary: Добавить маршрут в избранное
      description: Тот же вариант с теми же параметрами уже есть — возвращается существующая запись (200).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoriteCreate' }
      responses:
        '201':
          description: Добавлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorite' }
        '200':
          description: Уже было в избранном
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorite' }
        '422': { $ref: '#/components/responses/Problem' }

  /favorites/{id}:
    delete:
      tags: [favorites]
      operationId: deleteFavorite
      summary: Убрать из избранного
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Удалено }
        '404': { $ref: '#/components/responses/Problem' }

  /favorites/{id}/current:
    get:
      tags: [favorites]
      operationId: getFavoriteCurrent
      summary: Актуальная цена избранного маршрута
      description: |
        Повторяет сохранённый поиск с сохранёнными параметрами и ищет тот же вариант (аэропорт и даты
        или «на машине»). status: found — тот же вариант; replaced — его нет, показан лучший с теми же
        параметрами; past — месяц поездки прошёл; empty — вариантов нет; unavailable — источник цен недоступен.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Пересчитанный вариант
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoriteCurrent' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    RadiusKm:
      name: radius_km
      in: query
      schema: { type: integer, minimum: 0, maximum: 1000, default: 100 }
    MaxDriveHours:
      name: max_drive_hours
      in: query
      description: Максимум часов за рулём в одну сторону; 0 — без ограничения
      schema: { type: number, format: double, minimum: 0, maximum: 24, default: 8 }
    Travelers:
      name: travelers
      in: query
      schema: { type: integer, minimum: 1, maximum: 9, default: 1 }
    ConsumptionL100:
      name: consumption_l100
      in: query
      description: Расход топлива, л/100 км
      schema: { type: number, format: double, minimum: 2, maximum: 30, default: 8 }
    FuelTypeParam:
      name: fuel_type
      in: query
      schema: { $ref: '#/components/schemas/FuelType' }
    FuelPriceRub:
      name: fuel_price_rub
      in: query
      description: Своя цена топлива за литр; если не задана — из справочника
      schema: { type: number, format: double, minimum: 1, maximum: 1000 }
    AllowBorder:
      name: allow_border
      in: query
      description: Учитывать аэропорты в другой стране
      schema: { type: boolean, default: false }
    PlaceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    PlaceKind:
      type: string
      enum: [city, airport]

    Place:
      type: object
      required: [id, kind, iata, name, country_code, location, timezone]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PlaceKind' }
        iata: { type: string, example: KUF }
        city_iata:
          type: string
          description: Код города, к которому относится аэропорт
          example: KUF
        city_name:
          type: string
          description: Название города, к которому относится аэропорт
          example: Самара
        name: { type: string, example: Самара }
        name_en: { type: string, example: Samara }
        name_to:
          type: string
          description: Название в винительном падеже с предлогом
          example: в Самару
        country_code: { type: string, example: RU }
        location: { $ref: '#/components/schemas/Point' }
        timezone: { type: string, example: Europe/Samara }

    Money:
      type: object
      description: Сумма в минимальных единицах валюты (копейках)
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, example: 327360 }
        currency: { type: string, enum: [RUB] }

    FuelType:
      type: string
      enum: [ai92, ai95, dt, lpg]
      default: ai95

    CarHubsResponse:
      type: object
      required: [home, fuel_price, fuel_price_source, items]
      properties:
        home: { $ref: '#/components/schemas/Place' }
        fuel_price: { $ref: '#/components/schemas/Money' }
        fuel_price_source:
          type: string
          enum: [reference, user]
          description: reference — цена из справочника, user — задана пользователем
        items:
          type: array
          items: { $ref: '#/components/schemas/CarHub' }

    CarHub:
      type: object
      required: [place, straight_km, road, drive_hours, cost, per_person, parking_estimated]
      properties:
        place: { $ref: '#/components/schemas/Place' }
        straight_km: { type: number, format: double }
        road: { $ref: '#/components/schemas/RoadLeg' }
        drive_hours:
          type: number
          format: double
          description: Время в пути в одну сторону, включая время на границе
        cost: { $ref: '#/components/schemas/CarCost' }
        per_person: { $ref: '#/components/schemas/Money' }
        parking_estimated:
          type: boolean
          description: Цена парковки неизвестна, взято значение по умолчанию
        border: { $ref: '#/components/schemas/BorderInfo' }

    RoadLeg:
      type: object
      required: [distance_km, duration_min, approximate]
      properties:
        distance_km: { type: number, format: double }
        duration_min: { type: integer }
        approximate:
          type: boolean
          description: Оценка по прямой — маршрутизатор был недоступен

    CarCost:
      type: object
      description: Расходы на машину туда и обратно на всю группу
      required: [fuel, parking, border, total]
      properties:
        fuel: { $ref: '#/components/schemas/Money' }
        parking: { $ref: '#/components/schemas/Money' }
        border: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }

    BorderInfo:
      type: object
      required: [insurance, crossing_hours, note]
      properties:
        insurance: { $ref: '#/components/schemas/Money' }
        crossing_hours: { type: number, format: double }
        note: { type: string }

    TripsResponse:
      type: object
      required: [home, destination, options, no_data, partial, hidden_flights]
      properties:
        home: { $ref: '#/components/schemas/Place' }
        destination: { $ref: '#/components/schemas/Place' }
        fuel_price: { $ref: '#/components/schemas/Money' }
        options:
          type: array
          description: Лучший вариант через каждый аэропорт, дешёвые первыми
          items: { $ref: '#/components/schemas/TripOption' }
        home_best:
          $ref: '#/components/schemas/TripOption'
        no_data:
          type: array
          description: Аэропорты, по которым у источника нет цен на этот месяц
          items: { $ref: '#/components/schemas/Place' }
        partial:
          type: boolean
          description: Часть запросов к источнику цен не удалась
        drive: { $ref: '#/components/schemas/DriveTrip' }
        drive_skipped:
          type: string
          enum: [too_long, border_not_allowed, no_road]
          description: Почему нет варианта на машине (если use_car)
        hidden_flights:
          type: integer
          description: Сколько перелётов скрыто — не дешевле и не заметно быстрее машины

    DriveTrip:
      type: object
      description: |
        Поездка целиком на своей машине, туда и обратно. Предлагается, если дорога в одну сторону
        не дольше max_drive_hours и граница разрешена (allow_border). Даты свободные; парковка на месте не считается.
      required: [road, drive_hours, cost, total, per_person, trip_days, warnings]
      properties:
        road: { $ref: '#/components/schemas/RoadLeg' }
        drive_hours: { type: number, format: double, description: В одну сторону, с учётом границы }
        cost: { $ref: '#/components/schemas/CarCost' }
        total: { $ref: '#/components/schemas/Money' }
        per_person: { $ref: '#/components/schemas/Money' }
        trip_days: { type: integer, description: Длительность для расчёта (min_days) }
        border: { $ref: '#/components/schemas/BorderInfo' }
        savings_vs_home:
          $ref: '#/components/schemas/Money'
        warnings:
          type: array
          items:
            type: string
            enum: [border_crossing_by_car, road_approximate]

    TripOption:
      type: object
      required: [hub, depart_at, return_at, trip_days, airline, transfers, return_transfers,
                 duration_to_min, duration_back_min, ticket_per_person, tickets, total, per_person, warnings]
      properties:
        hub: { $ref: '#/components/schemas/Place' }
        arrival:  # аэропорт прилёта; нет — его нет в справочнике
          $ref: '#/components/schemas/Place'
        depart_at: { type: string, format: date-time }
        return_at: { type: string, format: date-time }
        trip_days: { type: integer }
        airline: { type: string, example: FS }
        transfers: { type: integer }
        return_transfers: { type: integer }
        duration_to_min: { type: integer }
        duration_back_min: { type: integer }
        found_on:
          type: string
          format: date
          description: Когда источник видел эту цену
        booking_url: { type: string }
        ticket_per_person:
          $ref: '#/components/schemas/Money'
        tickets:
          $ref: '#/components/schemas/Money'
        car: { $ref: '#/components/schemas/TripCar' }
        total: { $ref: '#/components/schemas/Money' }
        per_person: { $ref: '#/components/schemas/Money' }
        savings_vs_home:
          $ref: '#/components/schemas/Money'
        warnings:
          type: array
          items:
            type: string
            enum: [border_crossing_by_car, stale_price, parking_estimated, road_approximate]

    TripCar:
      type: object
      required: [road, drive_hours, cost]
      properties:
        road: { $ref: '#/components/schemas/RoadLeg' }
        drive_hours: { type: number, format: double }
        cost: { $ref: '#/components/schemas/CarCost' }
        border: { $ref: '#/components/schemas/BorderInfo' }

    HotelsProvider:
      type: string
      enum: [ostrovok, avito]
      default: ostrovok

    HotelsLink:
      type: object
      required: [url, provider, partner]
      properties:
        url: { type: string }
        provider: { $ref: '#/components/schemas/HotelsProvider' }
        partner: { type: boolean, description: Ссылка с партнёрской меткой }

    RoadRoute:
      type: object
      required: [road, polyline]
      properties:
        road: { $ref: '#/components/schemas/RoadLeg' }
        polyline:
          type: string
          description: Линия маршрута в формате Encoded Polyline с точностью 6 знаков (как polyline6 в OSRM)

    PoiList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Poi' }

    Poi:
      type: object
      description: Место из OpenStreetMap
      required: [id, category, kind, location, details_pending]
      properties:
        id: { type: string, description: Объект OSM, example: node/123456 }
        category:
          type: string
          enum: [fuel, food, attraction]
        kind:
          type: string
          description: Значение тега OSM — fuel, cafe, restaurant, fast_food, museum, viewpoint, castle…
          example: cafe
        name: { type: string }
        brand: { type: string, example: Лукойл }
        location: { $ref: '#/components/schemas/Point' }
        opening_hours: { type: string, description: Часы работы в формате OSM, example: 'Mo-Su 08:00-22:00' }
        website: { type: string }
        wikipedia: { type: string, description: 'Статья: язык и название', example: 'ru:Самарская площадь' }
        wikidata: { type: string, example: Q4140541 }
        cuisine:
          type: array
          description: Кухня, значения OSM
          items: { type: string, example: pizza }
        phone: { type: string }
        fee:
          type: string
          description: Плата за вход — yes, no или сумма, как указано в OSM
          example: 300 RUB
        description: { type: string, description: Первые предложения статьи Википедии или описание из Wikidata }
        photo: { $ref: '#/components/schemas/Photo' }
        details_pending:
          type: boolean
          description: Описание и фото ещё не загружались — их даст GET /pois/{type}/{id}

    Guide:
      type: object
      required: [source, title, url, license, listings]
      properties:
        source: { type: string, enum: [wikivoyage] }
        title: { type: string, example: Уральск }
        url: { type: string, description: Статья — для подписи «по материалам Викигида» }
        overview: { type: string, description: Вступление и начало раздела «Понять» }
        license: { type: string, example: CC BY-SA 4.0 }
        listings:
          type: array
          items: { $ref: '#/components/schemas/GuideListing' }

    GuideListing:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [see, do, eat, drink, sleep, buy, go, other]
          description: see — посмотреть, do — заняться, eat — еда, drink — бары, sleep — жильё, buy — покупки, go — транспорт
        name: { type: string }
        alt: { type: string }
        description: { type: string }
        address: { type: string }
        url: { type: string }
        hours: { type: string }
        price: { type: string }
        location: { $ref: '#/components/schemas/Point' }
        wikidata: { type: string }
        photo: { $ref: '#/components/schemas/Photo' }

    Photo:
      type: object
      description: Фото с Wikimedia Commons
      required: [url, page]
      properties:
        url: { type: string, description: Уменьшенная копия, 640 px по ширине }
        page: { type: string, description: Страница файла — автор и лицензия }
        credit: { type: string, example: 'Иван Иванов · CC BY-SA 4.0' }

    Address:
      type: object
      required: [label, location]
      properties:
        label: { type: string, example: 'Абай даңғылы 10, Алматы' }
        location: { $ref: '#/components/schemas/Point' }
        kind:
          type: string
          description: house — дом, street — только улица (точку стоит поправить)
          example: house
        distance_km:
          type: number
          format: double
          description: Расстояние от центра города

    TransferOption:
      type: object
      required: [mode, title, links]
      properties:
        mode:
          type: string
          enum: [taxi, public_transport, walk]
        title: { type: string, example: Такси }
        duration_min:
          type: integer
          description: Время в пути; нет — неизвестно без внешнего сервиса
        distance_km: { type: number, format: double }
        price: { $ref: '#/components/schemas/Money' }
        price_note:
          type: string
          description: Пояснение к цене, если её нет или она ориентировочная
        approximate:
          type: boolean
          description: Время или расстояние посчитаны приблизительно
        links:
          type: array
          description: Где открыть или заказать маршрут
          items:
            type: object
            required: [title, url]
            properties:
              title: { type: string, example: Яндекс Карты }
              url: { type: string }

    TripSearchParams:
      type: object
      description: Параметры поиска поездки — те же, что у запроса GET /trips
      required: [from, to, month]
      properties:
        from: { type: string, format: uuid }
        to: { type: string, format: uuid }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        min_days: { type: integer, minimum: 1, maximum: 60 }
        max_days: { type: integer, minimum: 1, maximum: 60 }
        travelers: { type: integer, minimum: 1, maximum: 9 }
        use_car: { type: boolean }
        radius_km: { type: integer, minimum: 0, maximum: 1000 }
        max_drive_hours: { type: number, format: double, minimum: 0, maximum: 24 }
        consumption_l100: { type: number, format: double, minimum: 2, maximum: 30 }
        fuel_type: { $ref: '#/components/schemas/FuelType' }
        fuel_price_rub: { type: number, format: double, minimum: 1, maximum: 1000 }
        allow_border: { type: boolean }

    FavoritePick:
      type: object
      description: Какой вариант выбран в результатах
      required: [kind]
      properties:
        kind:
          type: string
          enum: [flight, drive]
        hub_iata: { type: string, description: Аэропорт вылета (для flight), example: URA }
        depart_date: { type: string, format: date }
        return_date: { type: string, format: date }

    FavoriteSnapshot:
      type: object
      description: Вариант на момент сохранения — для «было → стало» и показа без пересчёта
      required: [total, per_person]
      properties:
        total: { $ref: '#/components/schemas/Money' }
        per_person: { $ref: '#/components/schemas/Money' }
        hub_name: { type: string }
        depart_at: { type: string, format: date-time }
        return_at: { type: string, format: date-time }
        trip_days: { type: integer }
        transfers: { type: integer }
        drive_hours: { type: number, format: double }
        found_on: { type: string, format: date }

    FavoriteCreate:
      type: object
      required: [title, params, pick, snapshot]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: 'Самара → Алматы, ноябрь' }
        params: { $ref: '#/components/schemas/TripSearchParams' }
        pick: { $ref: '#/components/schemas/FavoritePick' }
        snapshot: { $ref: '#/components/schemas/FavoriteSnapshot' }

    Favorite:
      type: object
      required: [id, title, params, pick, snapshot, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        params: { $ref: '#/components/schemas/TripSearchParams' }
        pick: { $ref: '#/components/schemas/FavoritePick' }
        snapshot: { $ref: '#/components/schemas/FavoriteSnapshot' }
        created_at: { type: string, format: date-time }

    FavoriteCurrent:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [found, replaced, past, empty, unavailable]
        result:
          $ref: '#/components/schemas/TripsResponse'
        option:
          $ref: '#/components/schemas/TripOption'
        drive:
          $ref: '#/components/schemas/DriveTrip'
        total: { $ref: '#/components/schemas/Money' }
        diff:
          $ref: '#/components/schemas/Money'

    Point:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double }
        lon: { type: number, format: double }

    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
